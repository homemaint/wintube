name: Build and release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # CI builds the MSVC target (Tauri's tested path for MSI/NSIS, and it
      # avoids the MSVC/GNU `resource.lib` mismatch). Local dev uses the
      # pinned GNU target from .cargo/config.toml + MinGW.
      - name: Set up Rust (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install WiX + NSIS
        run: |
          choco install wixtoolset nsis -y
          $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.14\bin;C:\Program Files (x86)\NSIS;$env:PATH"
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Fetch yt-dlp sidecar
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType Directory -Force src-tauri/sidecars | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe
          Copy-Item src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe src-tauri/binaries/yt-dlp.exe
          Copy-Item src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe src-tauri/sidecars/yt-dlp.exe
          .\src-tauri\binaries\yt-dlp.exe --version

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri bundle
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload MSI + NSIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wintube-Windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
