[workspace]
members = [
    "crates/wintube-innertube",
    "crates/wintube-services",
    "crates/wintube-player",
    "crates/wintube-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["WinTube Team"]
license = "GPL-3.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls-vendored", "json", "stream", "cookies", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
redb = "2.4"
iced = { version = "0.13", features = ["tokio", "image", "advanced"] }

