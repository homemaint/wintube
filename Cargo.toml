[workspace]
members = [
    "crates/wintube-core",
    "crates/wintube-yt",
    "crates/wintube-download",
    "crates/wintube-storage",
    "crates/wintube-player",
    "crates/wintube-mux",
    "src-tauri",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures = "0.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
